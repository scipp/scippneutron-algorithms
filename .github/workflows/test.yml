name: Test

on:
  workflow_dispatch:
    inputs:
      os-variant:
        default: 'ubuntu-24.04'
        type: string
        description: 'Operating system'
      python-version:
        type: string
        description: 'Python interpreter version'
      checkout-ref:
        default: ''
        type: string
        description: 'Git ref to checkout'
  workflow_call:
    inputs:
      os-variant:
        default: 'ubuntu-24.04'
        type: string
      python-version:
        type: string
      checkout-ref:
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: "never"
  PIXI_COLOR: "never"

jobs:
  tests:
    name: Tests ${{ inputs.os-variant }}
    runs-on: ${{ inputs.os-variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref }}
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false
          components: cargo, rustc, rust-std
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.2
          # Install runs below to use the chosen Python version.
          run-install: false
      - name: Set Python version
        run: pixi add "python=${{ inputs.python-version }}"
      - name: Install environment
        run: pixi install -e default --frozen && pixi list -e default
      - name: Run tests
        run: pixi run --as-is python -m pytest
