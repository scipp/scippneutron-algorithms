name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # pixi environment variables, i.e. `pixi run --as-is`
  PIXI_FROZEN: true
  PIXI_NO_INSTALL: true

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy,rustfmt
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.2
          frozen: true
          environments: lint
      - run: pixi run -e lint lint

  type-checking:
    name: Type checking
    needs: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.2
          frozen: true
          environments: default
      - run: pixi run typecheck

  tests:
    name: Tests
    needs: formatting
    strategy:
      matrix:
        include:
          - {python: '3.14', os: ubuntu-24.04}
          - {python: '3.13', os: ubuntu-24.04}
          - {python: '3.12', os: ubuntu-24.04}
          - {python: '3.11', os: ubuntu-24.04}
          - {python: '3.11', os: macos-14}
          - {python: '3.11', os: windows-2025}
    uses: ./.github/workflows/test.yml
    with:
      os-variant: ${{ matrix.os }}
      python-version: ${{ matrix.python }}

  docs:
    needs: tests
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
