name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish:
        default: true
        type: boolean
        description: "Publish to PyPI"

env:
  CARGO_TERM_COLOR: "never"
  PIXI_COLOR: "never"

jobs:
  build_linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
          sccache: false
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  build_macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
          sccache: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  build_windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-2025
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
          sccache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --locked --compatibility pypi --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  upload_packages:
    name: Deploy packages
    needs: [ build_linux, build_macos, build_windows, sdist ]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/p/scippneutron-algorithms/
    permissions:
      id-token: write
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@vdc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true
